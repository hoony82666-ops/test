<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>계산기</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1f1c2c, #928dab);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .calculator {
    width: 320px;
    background: #202124;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  }
  .display {
    color: #fff;
    text-align: right;
    padding: 20px 16px;
    min-height: 90px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    word-break: break-all;
  }
  .display .prev {
    font-size: 16px;
    color: #9aa0a6;
    min-height: 20px;
  }
  .display .curr {
    font-size: 36px;
    font-weight: 500;
  }
  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 10px;
  }
  button {
    border: none;
    border-radius: 12px;
    font-size: 20px;
    padding: 18px 0;
    cursor: pointer;
    background: #303134;
    color: #fff;
    transition: filter 0.15s;
  }
  button:hover { filter: brightness(1.2); }
  button:active { filter: brightness(0.9); }
  button.operator { background: #ff9f0a; }
  button.equals { background: #ff9f0a; }
  button.function { background: #5f6368; }
  button.zero { grid-column: span 2; }
</style>
</head>
<body>

<div class="calculator">
  <div class="display">
    <div class="prev" id="prevOperand"></div>
    <div class="curr" id="currOperand">0</div>
  </div>
  <div class="buttons">
    <button class="function" data-action="clear">AC</button>
    <button class="function" data-action="delete">DEL</button>
    <button class="function" data-action="percent">%</button>
    <button class="operator" data-operator="÷">÷</button>

    <button data-number="7">7</button>
    <button data-number="8">8</button>
    <button data-number="9">9</button>
    <button class="operator" data-operator="×">×</button>

    <button data-number="4">4</button>
    <button data-number="5">5</button>
    <button data-number="6">6</button>
    <button class="operator" data-operator="-">-</button>

    <button data-number="1">1</button>
    <button data-number="2">2</button>
    <button data-number="3">3</button>
    <button class="operator" data-operator="+">+</button>

    <button class="zero" data-number="0">0</button>
    <button data-number=".">.</button>
    <button class="equals" data-action="equals">=</button>
  </div>
</div>

<script>
class Calculator {
  constructor(prevEl, currEl) {
    this.prevEl = prevEl;
    this.currEl = currEl;
    this.clear();
  }

  clear() {
    this.currOperand = '0';
    this.prevOperand = '';
    this.operator = undefined;
    this.updateDisplay();
  }

  delete() {
    this.currOperand = this.currOperand.length > 1
      ? this.currOperand.slice(0, -1)
      : '0';
    this.updateDisplay();
  }

  appendNumber(number) {
    if (number === '.' && this.currOperand.includes('.')) return;
    if (this.currOperand === '0' && number !== '.') {
      this.currOperand = number;
    } else {
      this.currOperand += number;
    }
    this.updateDisplay();
  }

  chooseOperator(operator) {
    if (this.currOperand === '') return;
    if (this.prevOperand !== '') {
      this.compute();
    }
    this.operator = operator;
    this.prevOperand = this.currOperand;
    this.currOperand = '';
    this.updateDisplay();
  }

  percent() {
    this.currOperand = String(parseFloat(this.currOperand) / 100);
    this.updateDisplay();
  }

  compute() {
    let result;
    const prev = parseFloat(this.prevOperand);
    const curr = parseFloat(this.currOperand);
    if (isNaN(prev) || isNaN(curr)) return;
    switch (this.operator) {
      case '+': result = prev + curr; break;
      case '-': result = prev - curr; break;
      case '×': result = prev * curr; break;
      case '÷':
        if (curr === 0) {
          this.currOperand = 'Error';
          this.prevOperand = '';
          this.operator = undefined;
          this.updateDisplay();
          return;
        }
        result = prev / curr;
        break;
      default: return;
    }
    result = Math.round((result + Number.EPSILON) * 1e10) / 1e10;
    this.currOperand = String(result);
    this.operator = undefined;
    this.prevOperand = '';
  }

  updateDisplay() {
    this.currEl.textContent = this.formatNumber(this.currOperand);
    if (this.operator != null) {
      this.prevEl.textContent = `${this.formatNumber(this.prevOperand)} ${this.operator}`;
    } else {
      this.prevEl.textContent = '';
    }
  }

  formatNumber(value) {
    if (value === 'Error') return value;
    const stringValue = value.toString();
    const [intPart, decimalPart] = stringValue.split('.');
    const formattedInt = isNaN(parseFloat(intPart))
      ? intPart
      : parseFloat(intPart).toLocaleString('en-US');
    return decimalPart != null ? `${formattedInt}.${decimalPart}` : formattedInt;
  }
}

const prevOperandEl = document.getElementById('prevOperand');
const currOperandEl = document.getElementById('currOperand');
const calculator = new Calculator(prevOperandEl, currOperandEl);

document.querySelectorAll('[data-number]').forEach(button => {
  button.addEventListener('click', () => {
    calculator.appendNumber(button.dataset.number);
  });
});

document.querySelectorAll('[data-operator]').forEach(button => {
  button.addEventListener('click', () => {
    calculator.chooseOperator(button.dataset.operator);
  });
});

document.querySelector('[data-action="equals"]').addEventListener('click', () => {
  calculator.compute();
  calculator.updateDisplay();
});

document.querySelector('[data-action="clear"]').addEventListener('click', () => {
  calculator.clear();
});

document.querySelector('[data-action="delete"]').addEventListener('click', () => {
  calculator.delete();
});

document.querySelector('[data-action="percent"]').addEventListener('click', () => {
  calculator.percent();
});

window.addEventListener('keydown', (e) => {
  if (e.key >= '0' && e.key <= '9') calculator.appendNumber(e.key);
  else if (e.key === '.') calculator.appendNumber('.');
  else if (e.key === '+') calculator.chooseOperator('+');
  else if (e.key === '-') calculator.chooseOperator('-');
  else if (e.key === '*') calculator.chooseOperator('×');
  else if (e.key === '/') { e.preventDefault(); calculator.chooseOperator('÷'); }
  else if (e.key === 'Enter' || e.key === '=') { calculator.compute(); calculator.updateDisplay(); }
  else if (e.key === 'Backspace') calculator.delete();
  else if (e.key === 'Escape') calculator.clear();
});
</script>

</body>
</html>
